[package]
name = "ostracon-app"
description = "The Ostracon desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "ostracon-app"

[lib]
name = "ostracon_app"
path = "src/lib.rs"

[[bin]]
name = "ostracon-app"
path = "src/main.rs"

[dependencies]
ostracon-core.workspace = true
jiff.workspace = true
serde_json.workspace = true
# gpui and gpui-component come only through the kit, exact-pinned.
gpui-kit = "=0.9.0"
# Only to talk to gpui-kit's calendar, which works in chrono dates; Ostracon itself uses jiff.
chrono = { version = "0.4", default-features = false }

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
tempfile.workspace = true

[[test]]
name = "state"
path = "tests/state.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSBundle", "NSError", "NSObject", "NSSet", "NSString"] }
objc2-user-notifications = { version = "0.3.2", features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[[test]]
name = "ui"
path = "tests/ui.rs"
