[workspace]
resolver = "3"
members = ["crates/ostracon-core", "crates/ostracon-app"]
default-members = ["crates/ostracon-core", "crates/ostracon-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bevan-philip/ostracon-rust"

[workspace.dependencies]
ostracon-core = { path = "crates/ostracon-core" }
jiff = "1"
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1"
tempfile = "3"
sys-locale = "0.3"
dirs = "6"

# Third-party crates optimised in dev builds so the GPUI app is usable while developing.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
